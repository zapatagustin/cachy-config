###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Apps
bind = $mainMod, RETURN, exec, uwsm app -- $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, Space, togglefloating,
bind = $mainMod, F, fullscreen
bind = $mainMod, D, exec, echo toggle >> /tmp/qs-launcher
#bind = $mainMod, D, exec, $menu
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = SUPER SHIFT, L, exec, loginctl lock-session
bind = SUPER, P, exec, echo toggle >> /tmp/qs-clipboard

# Screenshots (grim + slurp). Copia al clipboard y guarda en ~/Pictures/Screenshots
bind = , Print, exec, ~/.config/hypr/screenshot.sh region
bind = SHIFT, Print, exec, ~/.config/hypr/screenshot.sh window
bind = CTRL, Print, exec, ~/.config/hypr/screenshot.sh output
bind = SUPER, Print, exec, ~/.config/hypr/screenshot.sh screen


# Move focus vim + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move window vim + arrow keys
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Cambiar VD solo en monitor activo
bind = $mainMod, 1, exec, ~/.config/hypr/switch-monitor.sh 1
bind = $mainMod, 2, exec, ~/.config/hypr/switch-monitor.sh 2
bind = $mainMod, 3, exec, ~/.config/hypr/switch-monitor.sh 3
bind = $mainMod, 4, exec, ~/.config/hypr/switch-monitor.sh 4
bind = $mainMod, 5, exec, ~/.config/hypr/switch-monitor.sh 5
bind = $mainMod, 6, exec, ~/.config/hypr/switch-monitor.sh 6
bind = $mainMod, 7, exec, ~/.config/hypr/switch-monitor.sh 7
bind = $mainMod, 8, exec, ~/.config/hypr/switch-monitor.sh 8
bind = $mainMod, 9, exec, ~/.config/hypr/switch-monitor.sh 9

# Virtual desktops: Alt+1-9 cambia todos los monitores juntos
bind = ALT, 1, exec, ~/.config/hypr/switch-group.sh 1
bind = ALT, 2, exec, ~/.config/hypr/switch-group.sh 2
bind = ALT, 3, exec, ~/.config/hypr/switch-group.sh 3
bind = ALT, 4, exec, ~/.config/hypr/switch-group.sh 4
bind = ALT, 5, exec, ~/.config/hypr/switch-group.sh 5
bind = ALT, 6, exec, ~/.config/hypr/switch-group.sh 6
bind = ALT, 7, exec, ~/.config/hypr/switch-group.sh 7
bind = ALT, 8, exec, ~/.config/hypr/switch-group.sh 8
bind = ALT, 9, exec, ~/.config/hypr/switch-group.sh 9

# Mover ventana al VD (sin cambiar de vista)
bind = $mainMod SHIFT, 1, exec, ~/.config/hypr/move-to-group.sh 1
bind = $mainMod SHIFT, 2, exec, ~/.config/hypr/move-to-group.sh 2
bind = $mainMod SHIFT, 3, exec, ~/.config/hypr/move-to-group.sh 3
bind = $mainMod SHIFT, 4, exec, ~/.config/hypr/move-to-group.sh 4
bind = $mainMod SHIFT, 5, exec, ~/.config/hypr/move-to-group.sh 5
bind = $mainMod SHIFT, 6, exec, ~/.config/hypr/move-to-group.sh 6
bind = $mainMod SHIFT, 7, exec, ~/.config/hypr/move-to-group.sh 7
bind = $mainMod SHIFT, 8, exec, ~/.config/hypr/move-to-group.sh 8
bind = $mainMod SHIFT, 9, exec, ~/.config/hypr/move-to-group.sh 9

# Mover TODAS las ventanas de los 3 monitores al VD group N (Alt+Shift)
bind = ALT SHIFT, 1, exec, ~/.config/hypr/move-all-to-group.sh 1
bind = ALT SHIFT, 2, exec, ~/.config/hypr/move-all-to-group.sh 2
bind = ALT SHIFT, 3, exec, ~/.config/hypr/move-all-to-group.sh 3
bind = ALT SHIFT, 4, exec, ~/.config/hypr/move-all-to-group.sh 4
bind = ALT SHIFT, 5, exec, ~/.config/hypr/move-all-to-group.sh 5
bind = ALT SHIFT, 6, exec, ~/.config/hypr/move-all-to-group.sh 6
bind = ALT SHIFT, 7, exec, ~/.config/hypr/move-all-to-group.sh 7
bind = ALT SHIFT, 8, exec, ~/.config/hypr/move-all-to-group.sh 8
bind = ALT SHIFT, 9, exec, ~/.config/hypr/move-all-to-group.sh 9

# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+ && echo . >> /tmp/qs-brightness
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%- && echo . >> /tmp/qs-brightness

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
