# ── hypridle.conf ──────────────────────────────────────────────────────────

general {
    lock_cmd        = pidof hyprlock || hyprlock   # no lanzar si ya está corriendo
    before_sleep_cmd = loginctl lock-session        # bloquear antes de suspender
    after_sleep_cmd  = hyprctl dispatch dpms on     # prender pantalla al volver
}

# 1. A los 4 minutos: bajar brillo al 20%
listener {
    timeout  = 240
    on-timeout = brightnessctl -s set 20%
    on-resume  = brightnessctl -r               # restaurar brillo guardado
}

# 2. A los 5 minutos: bloquear pantalla
listener {
    timeout  = 300
    on-timeout = loginctl lock-session
    on-resume  = hyprctl dispatch dpms on
}

# 3. A los 6 minutos: apagar pantalla (después de bloquear)
listener {
    timeout  = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 4. A los 15 minutos: suspender
listener {
    timeout  = 900
    on-timeout = systemctl suspend
}
