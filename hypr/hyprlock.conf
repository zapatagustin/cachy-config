# ── hyprlock.conf ─────────────────────────────────────────────────────────
# Gruvbox Dark — tematizado igual que la barra

general {
    disable_loading_bar = true
    hide_cursor         = true
    grace               = 0
    no_fade_in          = false
}

# ── Fondo de pantalla ──────────────────────────────────────────────────────
background {
    monitor  =
    path     = ~/Pictures/Wallpapers/lock-wallpaper.jpg

    # Blur sutil para que el texto sea legible
    blur_passes = 2
    blur_size   = 4
    brightness  = 0.6
    contrast    = 0.9
    vibrancy    = 0.2
}

# ── Reloj grande centrado ──────────────────────────────────────────────────
label {
    monitor  =
    text     = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    color    = rgba(235, 219, 178, 0.95)   # Gruvbox fg
    font_size   = 96
    font_family = Noto Sans JP Bold

    position  = 0, 120
    halign    = center
    valign    = center
}

# Fecha debajo del reloj
label {
    monitor  =
    text     = cmd[update:60000] echo "$(date +"%A, %d de %B de %Y" | sed 's/\b./\u&/g')"
    color    = rgba(168, 153, 132, 0.90)   # Gruvbox fg4
    font_size   = 22
    font_family = Noto Sans JP

    position  = 0, 30
    halign    = center
    valign    = center
}

# ── Campo de contraseña ────────────────────────────────────────────────────
input-field {
    monitor  =
    size     = 280, 42

    # Colores Gruvbox
    outer_color    = rgba(40, 40, 40, 0.85)    # bg
    inner_color    = rgba(60, 56, 54, 0.90)    # bg1
    font_color     = rgba(235, 219, 178, 1.0)  # fg

    # Estado: normal
    color          = rgba(60, 56, 54, 0.90)

    # Estado: caps lock encendido
    check_color    = rgba(215, 153, 33, 1.0)   # yellow
    fail_color     = rgba(204, 36, 29, 0.85)   # red

    # Placeholder
    placeholder_text = <span foreground="##a89984">contraseña...</span>
    hide_input       = false
    dots_size        = 0.30
    dots_spacing     = 0.20
    dots_center      = true

    fade_on_empty    = true
    capslock_color   = rgba(215, 153, 33, 1.0)

    position  = 0, -100
    halign    = center
    valign    = center

    rounding = 6
}

# Texto de ayuda debajo del input
label {
    monitor  =
    text     = Ingresá tu contraseña para desbloquear
    color    = rgba(168, 153, 132, 0.70)
    font_size   = 13
    font_family = Noto Sans JP

    position  = 0, -155
    halign    = center
    valign    = center
}
