################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# NOTA: los Samsung externos se configuran dinámicamente desde setup-monitors.sh
# (ambos comparten EDID y el dock Surface les asigna puertos variables).

# Built-in (laptop): 2256x1504 @ 150% scale, debajo de los Samsung, centrado
monitor=eDP-1,preferred,1168x1080,1.6

# TV 4K por HDMI: 10-bit + wide gamut (BT2020 sin PQ/HDR). El modo HDR pleno
# (cm hdredid) da tinte verde en este panel; wide gamut sí negocia bien el color.
monitor=HDMI-A-1,3840x2160@60,0x0,2,bitdepth,10,cm,wide

# Fallback: cualquier otro monitor desconocido (incluye Samsungs hasta que setup-monitors.sh los reconfigura)
monitor=,preferred,auto,auto
