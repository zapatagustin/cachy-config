################
### STARTUP ###
################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# uwsm: propaga env vars de Hyprland a systemd/dbus user session.
# HYPRLAND_INSTANCE_SIGNATURE es necesaria para que los systemd user services
# (quickshell, hyprpaper, monitor-watcher) hablen con el socket de Hyprland.
exec-once = uwsm finalize HYPRLAND_INSTANCE_SIGNATURE

exec-once = systemctl --user start hyprpolkitagent
# exec-once = hypridle  # desactivado por problema con hyprlock
exec-once = wl-paste --type text --watch cliphist store #Stores only text data
exec-once = wl-paste --type image --watch cliphist store #Stores only image data
# hyprpaper, quickshell y monitor-watcher ahora corren como systemd user units
# (bound a graphical-session.target). Ver ~/.config/systemd/user/.
exec-once = bash ~/.config/hypr/set-theme.sh dark
exec-once = bash ~/.config/hypr/setup-monitors.sh
